[workspace]
members = ["derive"]

[package]
name = "bevy_stat_query"
version = "0.6.0"
edition = "2024"

authors = ["Mincong Lu <mintlux667@gmail.com>"]
license = "MIT OR Apache-2.0"

readme = "README.md"
repository = "https://github.com/mintlu8/bevy_stat_query"
description = """
Blazing fast and versatile RPG stat system for the bevy engine.
"""
keywords = ["bevy", "rpg", "stat"]

[features]
default = ["derive", "serde"]
derive = ["bevy_stat_query_derive"]
## Skip serializing fields on stats with default values, at the cost of making
## non-self describing formats like postcard to fail.
pretty_print = ["serde"]

[lib]
doctest = false

[dependencies]
bevy_ecs = { version = "0.18.0" }
bevy_app = { version = "0.18.0" }
bevy_log = { version = "0.18.0" }
bevy_reflect = { version = "0.18.0" }
serde = { version = "1", features = ["derive"], optional = true }
ref-cast = "1"
thiserror = "1"
rustc-hash = "2.0.0"
bevy_stat_query_derive = { version = "0.2.0", path = "./derive", optional = true }

[dev-dependencies]
bevy = "0.18.0"
bitflags = "2.4.2"
num_enum = "0.7.2"
postcard = { version = "1.0.8", features = ["alloc"], default-features = false }
serde_json = "1.0.114"
strum = { version = "0.26.2", features = ["derive"] }
criterion = "0.5.1"
erased-serde = "0.4.9"

[[bench]]
name = "bench"
harness = false

[[example]]
name = "dynamic_serialization"
path = "examples/dynamic_serialization.rs"
required-features = ["serde"]
